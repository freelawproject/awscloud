[package]
name = "recap_email"
version = "0.1.0"
edition = "2024"

[dependencies]
aws_lambda_events = { version = "1.2", default-features = false, features = ["ses"] }
lambda_runtime = "1.3"
regex = "1.13"
reqwest = { version = "0.13", features = ["json"] }
sentry = "0.48"
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
tower = { version = "0.5.3", features = ["retry", "util"] }

[dev-dependencies]
sentry = { version = "0.48", features = ["test"] }
temp-env = { version = "0.3.6", features = ["async_closure"] }
wiremock = "0.6"
aws_lambda_events = { version = "1.2", features = ["builders"] }
chrono = "0.4"
